<html>
    <head>
        <title>Form</title>
    </head>
    <body bgcolor="mistyrose">
        <center>
            <h1><u>KVA DAV College for Women, Karnal</u></h1>
            <h2>Department of Computer Science</h2>
            <h3><u>Personal Details</u></h3>
        </center>
        <hr>
        <form>
            <label>Name:</label>
            <input type="text" name="name">
            <br><br>
            <label>Password:</label>
            <input type="password" name="password">
            <br><br>
            <label>Email:</label>
            <input type="email" name="email">
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male">
            <label>Male</label>
            <input type="radio" name="gender" value="female">
            <label>Female</label>
            <br><br>
            <label>Course:</label>
            <input type="checkbox" name="course" value="msc">M.Sc.
            <input type="checkbox" name="course" value="btech">B.Tech
            <br><br>
            <label>City:</label>
            <select name="city">
                <option value="karnal">Karnal</option>
                <option value="delhi">Delhi</option>
                <option value="chandigarh">Chandigarh</option>
                <option value="mumbai">Panipat</option>
            </select>
            <br><br>
            <label>Date of Birth:</label>
            <input type="date" name="dob">
            <br><br>
            <label>Address:</label>
            <input type="text" name="address">
            <br>
            <text area rows="5" cols="40" name="address">
                </text area>
                <br><br>
                <label>Upload Photo:</label>
                <input type="file" name="photo">
                <br><br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </text>
        </form>
    </body>
</html>
